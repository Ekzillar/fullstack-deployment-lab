<!DOCTYPE html>
<html>
<head>
    <title>DevOps Snippets</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>Мои DevOps Скрипты ':)'</h1>
    <div id="snippets">Загрузка данных...</div>

    <script>
        const API_URL = "http://127.0.0.1:8000/snippets"; 

        async function loadSnippets() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const container = document.getElementById('snippets');
                container.innerHTML = JSON.stringify(data);
            } catch (err) {
                document.getElementById('snippets').innerText = "Ошибка связи с API: " + err;
            }
        }
        loadSnippets();
    </script>
</body>
</html>
