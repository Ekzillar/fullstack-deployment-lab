apiVersion: apps/v1
kind: Deployment
metadata:
  name: snippets-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snippets-api
  template:
    metadata:
      labels:
        app: snippets-api
    spec:
      containers:
      - name: api
        image: devops-snippets-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DATABASE_URL
